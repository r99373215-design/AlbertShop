<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Albert Shop</title>
  <style>
    :root {
      --ink: #111111;
      --paper: #f7f5f2;
      --panel: #ffffff;
      --line: #e7e4df;
      --muted: #666;
      --accent: #111111;
      --soft: #f2efe9;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    a { color: inherit; text-decoration: none; }

    .admin-shell {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .topbar a {
      background: var(--ink);
      color: white;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .field.full {
      grid-column: 1 / -1;
    }

    .upload-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-input {
      display: block;
      border: 1px dashed var(--line);
      background: var(--soft);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: var(--ink);
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .sizes-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .size-chip {
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .size-chip.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .preview-box {
      margin-top: 18px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf8f5;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 14px;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 16px;
      object-fit: cover;
    }

    .action-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    button {
      border: none;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }

    .save-btn {
      background: var(--ink);
      color: white;
      padding: 12px 20px;
    }

    .reset-btn {
      background: #f0ece7;
      color: var(--ink);
      padding: 12px 20px;
    }

    .items-list {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .item-card {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      background: var(--soft);
    }

    .item-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .item-name {
      font-weight: 800;
      font-size: 20px;
    }

    .item-price {
      font-weight: 800;
      font-size: 18px;
    }

    .item-sizes {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .item-desc {
      color: #4b4b4b;
      font-size: 13px;
      line-height: 1.6;
    }

    .item-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .delete-btn {
      background: #f3efec;
      color: var(--ink);
      padding: 10px 12px;
      flex: 1;
    }

    .publish-btn {
      background: var(--ink);
      color: white;
      padding: 10px 12px;
      flex: 1;
    }

    @media (max-width: 760px) {
      .form-grid, .items-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div class="topbar">
      <div class="brand">ALBERT ADMIN</div>
      <a href="index.html">Вернуться в магазин</a>
    </div>

    <div class="panel">
      <div class="form-grid">
        <div class="field">
          <label for="name">Название товара</label>
          <input id="name" type="text" placeholder="Например: Palm Angels velour pants" />
        </div>

        <div class="field">
          <label for="category">Категория</label>
          <input id="category" type="text" placeholder="Например: Штаны" />
        </div>

        <div class="field">
          <label for="price">Цена</label>
          <input id="price" type="number" placeholder="9900" />
        </div>

        <div class="field">
          <label for="image">Ссылка на фото</label>
          <input id="image" type="url" placeholder="https://example.com/image.jpg" />
        </div>

        <div class="field full">
          <label for="photoFile">или выбрать фото с галереи</label>
          <div class="upload-row">
            <input id="photoFile" class="file-input" type="file" accept="image/*" />
          </div>
        </div>

        <div class="field full">
          <label>Размеры</label>
          <div class="sizes-wrap" id="sizeOptions">
            <div class="size-chip" data-size="XS">XS</div>
            <div class="size-chip" data-size="S">S</div>
            <div class="size-chip" data-size="M">M</div>
            <div class="size-chip" data-size="L">L</div>
            <div class="size-chip" data-size="XL">XL</div>
            <div class="size-chip" data-size="XXL">XXL</div>
          </div>
        </div>

        <div class="field full">
          <label for="description">Описание</label>
          <textarea id="description" placeholder="Напишите описание товара, материалы, стиль, особенности..."></textarea>
        </div>
      </div>

      <div class="preview-box" id="previewBox">
        Загрузите фото, чтобы увидеть превью товара.
      </div>

      <div class="action-row">
        <button class="save-btn" id="saveProduct">Сохранить товар</button>
        <button class="reset-btn" id="resetForm">Очистить форму</button>
      </div>
    </div>

    <div class="items-list" id="itemsList"></div>
  </div>

  <script>
    const DEFAULT_PRODUCTS = [
      {
        id: 1,
        name: 'Товар 1',
        category: 'Кроссовки',
        price: 9900,
        description: 'Лёгкая модель с мягкой подошвой для повседневной носки.',
        image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80',
        sizes: ['S', 'M', 'L']
      },
      {
        id: 2,
        name: 'Palm Angels velour pants',
        category: 'Штаны',
        price: 10990,
        description: 'Велюровые штаны с ярким дизайном и комфортной посадкой.',
        image: '5285432766902247446.jpg',
        sizes: ['S', 'M', 'L', 'XL']
      }
    ];

    const storageKey = 'albert-managed-products';
    const sizeButtons = [...document.querySelectorAll('.size-chip')];
    const selectedSizes = new Set();
    let selectedPhotoDataUrl = '';

    const normalizeProductImage = (product) => {
      if (product?.image) return product.image;
      if (Array.isArray(product?.images) && product.images.length) return product.images[0];
      return 'https://placehold.co/800x800?text=No+Image';
    };

    function getProducts() {
      try {
        const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
        return stored.length ? stored : DEFAULT_PRODUCTS;
      } catch {
        return DEFAULT_PRODUCTS;
      }
    }

    function saveProducts(products) {
      localStorage.setItem(storageKey, JSON.stringify(products));
    }

    function renderProducts() {
      const container = document.getElementById('itemsList');
      const products = getProducts();

      if (!container) return;

      container.innerHTML = products.map((product) => `
        <div class="item-card">
          <img src="${normalizeProductImage(product)}" alt="${product.name}" />
          <div class="item-meta">
            <div class="item-name">${product.name}</div>
            <div class="item-price">${Number(product.price || 0).toLocaleString('ru-RU')} ₽</div>
          </div>
          <div class="item-sizes">Размеры: ${Array.isArray(product.sizes) ? product.sizes.join(', ') : '—'}</div>
          <div class="item-desc">${product.description || 'Описание отсутствует.'}</div>
          <div class="item-actions">
            <button class="delete-btn" data-id="${product.id}">Удалить</button>
            <button class="publish-btn" data-id="${product.id}">Опубликовать</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.delete-btn').forEach((button) => {
        button.addEventListener('click', () => {
          const id = Number(button.dataset.id);
          const next = getProducts().filter((item) => Number(item.id) !== id);
          saveProducts(next);
          localStorage.setItem(storageKey, JSON.stringify(next));
          renderProducts();
        });
      });

      document.querySelectorAll('.publish-btn').forEach((button) => {
        button.addEventListener('click', () => {
          const id = Number(button.dataset.id);
          const products = getProducts();
          const product = products.find((item) => Number(item.id) === id);
          if (!product) return;

          const current = JSON.parse(localStorage.getItem(storageKey) || '[]');
          const merged = [...current.filter((item) => Number(item.id) !== id), product];
          localStorage.setItem(storageKey, JSON.stringify(merged));
          localStorage.setItem('albert-last-published', String(Date.now()));
          window.dispatchEvent(new Event('storage'));
          window.location.href = 'index.html';
        });
      });
    }

    function updatePreview() {
      const image = selectedPhotoDataUrl || document.getElementById('image').value.trim();
      const previewBox = document.getElementById('previewBox');

      if (!image) {
        previewBox.innerHTML = 'Загрузите фото, чтобы увидеть превью товара.';
        return;
      }

      previewBox.innerHTML = `<img src="${image}" alt="Preview" />`;
    }

    document.getElementById('photoFile').addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        selectedPhotoDataUrl = reader.result;
        document.getElementById('image').value = selectedPhotoDataUrl;
        updatePreview();
      };
      reader.onerror = () => {
        alert('Не удалось загрузить фото. Попробуйте выбрать изображение ещё раз.');
      };
      reader.readAsDataURL(file);
    });

    sizeButtons.forEach((chip) => {
      chip.addEventListener('click', () => {
        const size = chip.dataset.size;
        chip.classList.toggle('active');
        if (selectedSizes.has(size)) {
          selectedSizes.delete(size);
        } else {
          selectedSizes.add(size);
        }
      });
    });

    document.getElementById('image').addEventListener('input', updatePreview);

    document.getElementById('resetForm').addEventListener('click', () => {
      document.getElementById('name').value = '';
      document.getElementById('category').value = '';
      document.getElementById('price').value = '';
      document.getElementById('image').value = '';
      document.getElementById('description').value = '';
      document.getElementById('photoFile').value = '';
      selectedPhotoDataUrl = '';
      selectedSizes.clear();
      sizeButtons.forEach((chip) => chip.classList.remove('active'));
      updatePreview();
    });

    document.getElementById('saveProduct').addEventListener('click', () => {
      const name = document.getElementById('name').value.trim();
      const category = document.getElementById('category').value.trim();
      const price = Number(document.getElementById('price').value);
      const image = selectedPhotoDataUrl || document.getElementById('image').value.trim();
      const description = document.getElementById('description').value.trim();
      const sizes = [...selectedSizes];

      if (!name || !category || !price || !image || !description) {
        alert('Заполните все поля: название, категория, цена, фото и описание.');
        return;
      }

      const products = getProducts();
      const nextProduct = {
        id: Date.now(),
        name,
        category,
        price,
        image,
        images: [image],
        description,
        sizes: sizes.length ? sizes : ['One Size']
      };

      const nextProducts = [nextProduct, ...products];
      saveProducts(nextProducts);
      localStorage.setItem(storageKey, JSON.stringify(nextProducts));
      localStorage.setItem('albert-last-published', String(Date.now()));
      window.dispatchEvent(new Event('storage'));
      window.dispatchEvent(new CustomEvent('albert-products-updated'));
      renderProducts();
      document.getElementById('resetForm').click();
      alert('Товар успешно добавлен и виден в этом браузере после обновления страницы. Для всех устройств нужна серверная база данных.');
    });

    window.addEventListener('storage', (event) => {
      if (!event.key || event.key === storageKey) {
        renderProducts();
      }
    });

    window.addEventListener('albert-products-updated', renderProducts);

    renderProducts();
    updatePreview();
  </script>
</body>
</html>
